<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SekiPOS - {% block title %}{% endblock %}</title>
    
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.png') }}" type="image/x-icon">
    
    <script>
        // Apply theme BEFORE any CSS loads to prevent flash
        (function() {
            var theme = localStorage.getItem('theme');
            var isDark = (theme === 'dark') || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches);
            if (isDark) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
            if (localStorage.getItem('seki_food_mode') === 'true') {
                document.body.classList.add('food-mode-active');
            }
        })();
    </script>
    
    <link href="{{ url_for('static', filename='bootstrap.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='bootstrap-icons.min.css') }}" rel="stylesheet">
    <script src="{{ url_for('static', filename='socket.io.min.js') }}"></script>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    
    {% block head %}{% endblock %}
</head>
<body>

    {% include 'macros/navbar.html' %}

    <main class="container-fluid px-3">
        {% block content %}{% endblock %}
    </main>
    
    {% from 'macros/modals.html' import settings_modal %}
    {{ settings_modal() }}

    <script>
        (function() {
            var size = localStorage.getItem('seki_paper_size') || '80mm';
            var cssSize = (size === 'A4') ? 'A4' : (size === 'letter') ? 'letter' : size + ' auto';
            var zoneWidth = (size === 'A4' || size === 'letter') ? '100%' : size;

            var fontKey = localStorage.getItem('seki_receipt_size') || 'medium';
            var receiptFontSizes = { small: '15px', medium: '18px', large: '22px', xlarge: '28px' };
            var receiptFont = receiptFontSizes[fontKey] || '11px';

            var style = document.createElement('style');
            style.setAttribute('id', 'dynamic-page-size');
            style.innerHTML = '@media print { @page { size: ' + cssSize + '; margin: 0; } ' +
                '#receipt-print-zone, #kitchen-print-zone { width: ' + zoneWidth + ' !important; } ' +
                '#receipt-print-zone { font-size: ' + receiptFont + ' !important; } }';
            document.body.appendChild(style);
        })();
    </script>

    
    <script src="{{ url_for('static', filename='bootstrap.bundle.min.js') }}"></script>
    <script src="{{ url_for('static', filename='cookieStuff.js') }}"></script>
    <script src="{{ url_for('static', filename='themeStuff.js') }}"></script>
    
    {% block scripts %}{% endblock %}
</body>
</html>
